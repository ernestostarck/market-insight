# ==============================================================================
# MercadoInsight - NGINX Production Reverse Proxy Configuration
# ==============================================================================
# Sole public entrypoint terminating TLS on 443, redirecting HTTP (80 -> 443),
# enforcing rate limits, serving React, proxying /api, and protecting internal endpoints.
#
# Mounted resources:
#   /etc/nginx/certs/fullchain.pem, privkey.pem (read-only TLS certs)
#   /etc/nginx/auth/.htpasswd (basic-auth users for /grafana/ and /alertmanager/)
#   /var/www/certbot (for Let's Encrypt HTTP-01 challenge)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Preserve client's X-Request-ID (frontend generated) or generate one at the edge
map $http_x_request_id $request_id_value {
  default $http_x_request_id;
  ""      $request_id;
}

# --- HTTP Server (Port 80): ACME challenge, liveness probe, and HTTPS redirect ---
server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;

  # Let's Encrypt HTTP-01 ACME challenge
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/certbot;
  }

  # Unencrypted liveness endpoint for cloud load balancers and container orchestrators
  location = /health {
    proxy_pass http://backend:8000/health/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 301 Permanent Redirect to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS Server (Port 443): Secure TLS Proxy ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  # TLS Certificates
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Secure Protocols & Ciphers (Mozilla Intermediate recommendation)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # SSL Session optimization
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

  # Default Proxy Headers
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id_value;

  # Standard Proxy Timeouts
  proxy_connect_timeout 30s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # ----------------------------------------------------------------------------
  # Security Restrictions: Internal endpoints forbidden from outside
  # ----------------------------------------------------------------------------

  # Alertmanager internal webhook endpoint
  location = /api/v1/monitoring/alerts/webhook {
    return 403 "Forbidden\n";
  }

  # Prometheus metrics scraping endpoint
  location = /metrics {
    return 403 "Forbidden\n";
  }

  # ----------------------------------------------------------------------------
  # AI Conversational & Streaming / SSE Endpoints (Fase 9)
  # ----------------------------------------------------------------------------
  # Streaming requires buffering disabled and extended timeouts for long LLM generation
  location ~ ^/api/v1/(ai|chat)/ {
    limit_req zone=chat_limit burst=10 nodelay;
    proxy_pass http://backend:8000;

    # Streaming and SSE optimizations
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ----------------------------------------------------------------------------
  # API Endpoints (FastAPI)
  # ----------------------------------------------------------------------------
  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass http://backend:8000;
  }

  location = /health {
    proxy_pass http://backend:8000/api/v1/health;
  }

  # ----------------------------------------------------------------------------
  # Observability Tools (Protected behind Basic Auth)
  # ----------------------------------------------------------------------------
  location /grafana/ {
    auth_basic           "Restricted - MercadoInsight Operations";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id_value;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://grafana:3000;
  }

  location /alertmanager/ {
    auth_basic           "Restricted - MercadoInsight Operations";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id_value;
    proxy_pass http://alertmanager:9093/;
  }

  # ----------------------------------------------------------------------------
  # Frontend Static Assets Caching
  # ----------------------------------------------------------------------------
  location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:80;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
  }

  # ----------------------------------------------------------------------------
  # Frontend React SPA
  # ----------------------------------------------------------------------------
  location / {
    proxy_pass http://frontend:80;
  }
}
