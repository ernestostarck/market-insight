# Shared proxy headers. X-Forwarded-For is *replaced* with the real peer address so a
# client can't inject fake hops; the backend trusts it only from TRUSTED_PROXIES.
map $request_method $method_allowed {
  default 0;
  ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ 1;
}

server {
  listen 80;
  server_name _;

  limit_conn conn_limit 30;

  if ($method_allowed = 0) {
    return 405;
  }

  # Security headers for the web app (the API adds its own, stricter set).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # Enable once this server is reached over HTTPS only (behind TLS termination):
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  # Never serve dotfiles (.env, .git, ...) or common scanner targets.
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }
  location ~* (wp-admin|wp-login|phpmyadmin|\.php$) {
    return 404;
  }

  # Authentication endpoints: strict per-IP rate limit on top of the app's own lockout.
  location /api/v1/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/chat/ {
    limit_req zone=chat_limit burst=10 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:8000/api/v1/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Interactive API docs and metrics are never exposed through the public proxy.
  location ~ ^/(docs|redoc|openapi\.json|metrics) {
    return 404;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
