user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Performance and I/O
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Security: Disable server signature
  server_tokens off;

  # Request limits (short header/body timeouts mitigate slow-loris style attacks)
  client_max_body_size 25m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 30s;
  large_client_header_buffers 4 8k;

  # Compression (Gzip)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/ld+json
    image/svg+xml
    font/woff2;

  # Rate limiting zones
  # Global API: 25 requests/sec per client IP
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;
  # AI Chat & Streaming: 5 requests/sec per client IP
  limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;
  # Authentication (login, MFA, refresh): 10 requests/min per client IP — brute-force brake
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  # Concurrent connections per client IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Logging format including response time and upstream cache status
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

  include /etc/nginx/conf.d/*.conf;
}
