# Test environment: everything goes to the backend alert webhook with short timers, so
# delivery, deduplication and silencing can be verified in seconds (test-env.sh).
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  receiver: 'backend-webhook'

receivers:
  - name: 'backend-webhook'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/monitoring/alerts/webhook'
        send_resolved: true
