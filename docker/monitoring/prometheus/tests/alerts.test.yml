# GENERATED by build_alert_tests.py - do not edit by hand.
rule_files:
- ../rules/api.yml
- ../rules/data-quality.yml
- ../rules/etl.yml
- ../rules/infrastructure.yml
- ../rules/nlp.yml
- ../rules/slo.yml
evaluation_interval: 1m
tests:
- name: API unavailable
  interval: 1m
  input_series:
  - series: up{job="backend"}
    values: 1 1 0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: APIUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        team: backend
        job: backend
      exp_annotations:
        summary: API FastAPI de MercadoInsight no disponible
        description: El backend de FastAPI no responde a las solicitudes de monitoreo por más de 30 segundos.
- name: PostgreSQL unavailable
  interval: 1m
  input_series:
  - series: up{job="postgres-exporter"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: PostgreSQLUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: postgres
        team: database
        job: postgres-exporter
      exp_annotations:
        summary: PostgreSQL no disponible
        description: El exportador de métricas de PostgreSQL no responde; el motor de base de datos principal podría estar
          caído.
- name: Redis unavailable
  interval: 1m
  input_series:
  - series: up{job="redis-exporter"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: RedisUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: redis
        team: devops
        job: redis-exporter
      exp_annotations:
        summary: Redis no disponible
        description: El exportador de métricas de Redis no responde; la capa de caché y broker de tareas podría estar caída.
- name: ETL failed
  interval: 1m
  input_series:
  - series: etl_records_failed_total{pipeline="licitaciones"}
    values: 0 0 0 5x30
  alert_rule_test:
  - eval_time: 12m
    alertname: ETLFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-engineering
        pipeline: licitaciones
      exp_annotations:
        summary: Falla detectada en ejecución de pipeline ETL
        description: Se han registrado registros fallidos en el pipeline de sincronización de MercadoPúblico.
- name: ETL stale
  interval: 1m
  input_series:
  - series: etl_last_success_timestamp{pipeline="licitaciones"}
    values: -100000x40
  alert_rule_test:
  - eval_time: 20m
    alertname: ETLStale
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-engineering
        pipeline: licitaciones
      exp_annotations:
        summary: Pipeline ETL detenido o sin sincronización reciente (> 24 horas)
        description: La última ejecución exitosa del pipeline de extracción ocurrió hace más de 24 horas.
- name: Data freshness warning only
  interval: 1m
  input_series:
  - series: data_freshness_seconds
    values: 70000x60
  alert_rule_test:
  - eval_time: 35m
    alertname: DataFreshnessWarning
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-engineering
      exp_annotations: &id001
        summary: Antigüedad de datos en estado de advertencia (> 18 horas)
        description: La diferencia entre la hora actual y la fecha del último dato procesado supera las 18 horas (retraso
          en ciclo habitual de ChileCompra o inicio de fin de semana).
  - eval_time: 35m
    alertname: DataFreshnessCritical
    exp_alerts: []
- name: Data freshness critical
  interval: 1m
  input_series:
  - series: data_freshness_seconds
    values: 130000x60
  alert_rule_test:
  - eval_time: 35m
    alertname: DataFreshnessCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-engineering
      exp_annotations:
        summary: Antigüedad crítica de datos (> 36 horas)
        description: 'La diferencia entre la hora actual y el último dato procesado supera las 36 horas. Requiere triage:
          verificar primero el pipeline ETL y luego, por separado, la disponibilidad técnica de ChileCompra (components.chilecompra
          en /api/v1/system/status). La antigüedad de los datos por sí sola no prueba que ChileCompra esté caído.'
  - eval_time: 35m
    alertname: DataFreshnessWarning
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-engineering
      exp_annotations: *id001
- name: High API error rate
  interval: 1m
  input_series:
  - series: http_requests_total{status="500"}
    values: 0+10x30
  - series: http_requests_total{status="200"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 10m
    alertname: HighAPIErrorRate5xx
    exp_alerts:
    - exp_labels:
        severity: critical
        team: backend
      exp_annotations:
        summary: Tasa elevada de errores 5xx en la API (> 5%)
        description: La proporción de respuestas HTTP 5xx supera el 5% de las solicitudes en los últimos 5 minutos.
- name: High API latency
  interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{le="0.5"}
    values: '0x40'
  - series: http_request_duration_seconds_bucket{le="1"}
    values: 0+10x40
  - series: http_request_duration_seconds_bucket{le="+Inf"}
    values: 0+10x40
  alert_rule_test:
  - eval_time: 15m
    alertname: HighAPILatencyP95
    exp_alerts:
    - exp_labels:
        severity: warning
        team: backend
      exp_annotations:
        summary: Latencia P95 elevada en la API (> 500ms)
        description: El 95% de las solicitudes a la API superan los 500 milisegundos de tiempo de respuesta.
- name: PostgreSQL connection saturation
  interval: 1m
  input_series:
  - series: pg_stat_database_numbackends{instance="pg"}
    values: 95x20
  - series: pg_settings_max_connections{instance="pg"}
    values: 100x20
  alert_rule_test:
  - eval_time: 10m
    alertname: PostgreSQLConnectionSaturation
    exp_alerts:
    - exp_labels:
        severity: critical
        team: database
        instance: pg
      exp_annotations:
        summary: Saturación de conexiones en PostgreSQL (>85%)
        description: El número de conexiones activas excede el 85% del límite configurado en max_connections.
- name: Redis memory pressure
  interval: 1m
  input_series:
  - series: redis_memory_used_bytes{instance="r"}
    values: 90x20
  - series: redis_memory_max_bytes{instance="r"}
    values: 100x20
  alert_rule_test:
  - eval_time: 10m
    alertname: RedisMemoryPressure
    exp_alerts:
    - exp_labels:
        severity: warning
        team: devops
        instance: r
      exp_annotations:
        summary: Presión de memoria en Redis (>85%)
        description: Redis está utilizando más del 85% de la memoria máxima configurada (maxmemory).
- name: NLP processing failure (error rate)
  interval: 1m
  input_series:
  - series: nlp_errors_total{stage="runtime",error_code="ValueError"}
    values: 0+5x40
  alert_rule_test:
  - eval_time: 30m
    alertname: NLPHighErrorRate
    exp_alerts:
    - exp_labels:
        severity: critical
        team: ml-engineering
        stage: runtime
        error_code: ValueError
      exp_annotations:
        summary: Tasa elevada de errores en procesamiento NLP
        description: Se detectan fallos recurrentes en las etapas de clasificación, extracción o enriquecimiento semántico.
- name: NLP embedding failures
  interval: 1m
  input_series:
  - series: nlp_embedding_failures_total{model="m"}
    values: 0+2x30
  alert_rule_test:
  - eval_time: 12m
    alertname: NLPEmbeddingModelFailure
    exp_alerts:
    - exp_labels:
        severity: critical
        team: ml-engineering
        model: m
      exp_annotations:
        summary: Fallo recurrente en inferencia de embeddings
        description: Se han registrado más de 5 excepciones al generar representaciones vectoriales densas.
- name: NLP worker down
  interval: 1m
  input_series:
  - series: up{job="nlp-worker"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: NLPWorkerDown
    exp_alerts:
    - exp_labels:
        severity: critical
        team: ml-engineering
        job: nlp-worker
      exp_annotations:
        summary: Worker de procesamiento NLP / Celery caído
        description: El contenedor nlp-worker no está respondiendo a las solicitudes de telemetría.
- name: Data quality degraded (warning after 1h)
  interval: 1m
  input_series:
  - series: data_quality_score{pipeline="licitaciones"}
    values: 90x100
  alert_rule_test:
  - eval_time: 70m
    alertname: DataQualityScoreDegraded
    exp_alerts:
    - exp_labels:
        severity: warning
        team: data-engineering
        pipeline: licitaciones
      exp_annotations:
        summary: Degradación en el índice de calidad de datos (< 95%)
        description: El puntaje consolidado de completitud y validación de campos obligatorios ha caído por debajo del umbral
          del 95%.
  - eval_time: 70m
    alertname: DataQualityScoreCritical
    exp_alerts: []
- name: Data quality critical
  interval: 1m
  input_series:
  - series: data_quality_score{pipeline="licitaciones"}
    values: 80x100
  alert_rule_test:
  - eval_time: 20m
    alertname: DataQualityScoreCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        team: data-engineering
        pipeline: licitaciones
      exp_annotations:
        summary: Degradación crítica en el índice de calidad de datos (< 85%)
        description: El puntaje consolidado de calidad ha caído por debajo del umbral crítico del 85%, indicando anomalías
          severas en el lote ingerido.
- name: Healthy platform fires nothing
  interval: 1m
  input_series:
  - series: up{job="backend"}
    values: 1x60
  - series: up{job="postgres-exporter"}
    values: 1x60
  - series: up{job="redis-exporter"}
    values: 1x60
  - series: up{job="nlp-worker"}
    values: 1x60
  - series: etl_last_success_timestamp{pipeline="licitaciones"}
    values: 3600x60
  - series: data_freshness_seconds
    values: 600x60
  - series: data_quality_score{pipeline="licitaciones"}
    values: 99x60
  alert_rule_test:
  - eval_time: 50m
    alertname: APIUnavailable
    exp_alerts: []
  - eval_time: 50m
    alertname: PostgreSQLUnavailable
    exp_alerts: []
  - eval_time: 50m
    alertname: RedisUnavailable
    exp_alerts: []
  - eval_time: 50m
    alertname: ETLStale
    exp_alerts: []
  - eval_time: 50m
    alertname: DataFreshnessWarning
    exp_alerts: []
  - eval_time: 50m
    alertname: DataFreshnessCritical
    exp_alerts: []
  - eval_time: 50m
    alertname: DataQualityScoreDegraded
    exp_alerts: []
  - eval_time: 50m
    alertname: NLPWorkerDown
    exp_alerts: []
  - eval_time: 50m
    alertname: InstanceDown
    exp_alerts: []
- name: 'Fewer tenders published while ingestion is healthy: no operational alert'
  interval: 1m
  input_series:
  - series: up{job="backend"}
    values: 1x60
  - series: up{job="postgres-exporter"}
    values: 1x60
  - series: up{job="redis-exporter"}
    values: 1x60
  - series: up{job="nlp-worker"}
    values: 1x60
  - series: etl_last_success_timestamp{pipeline="licitaciones"}
    values: 3600x60
  - series: data_freshness_seconds
    values: 600x60
  - series: data_quality_score{pipeline="licitaciones"}
    values: 99x60
  - series: etl_records_processed_total{pipeline="licitaciones",action="read"}
    values: 0+60x20 1200+1x40
  - series: etl_records_failed_total{pipeline="licitaciones"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 50m
    alertname: ETLFailed
    exp_alerts: []
  - eval_time: 50m
    alertname: ETLHighErrorRate
    exp_alerts: []
  - eval_time: 50m
    alertname: ETLStale
    exp_alerts: []
  - eval_time: 50m
    alertname: DataFreshnessWarning
    exp_alerts: []
  - eval_time: 50m
    alertname: DataFreshnessCritical
    exp_alerts: []
