# Minimal Prometheus config for the test environment: scrapes only the API and the NLP worker,
# no exporters. Rules are loaded and alerts go to the test Alertmanager.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "market-insight-backend"
          environment: "test"

  - job_name: "nlp-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nlp-worker:8000"]
        labels:
          app: "market-insight-nlp"
          environment: "test"
