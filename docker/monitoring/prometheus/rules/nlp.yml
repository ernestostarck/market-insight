groups:
  - name: nlp_alerts
    rules:
      - alert: NLPWorkerDown
        expr: up{job="nlp-worker"} == 0
        for: 1m
        labels:
          severity: critical
          team: ml-engineering
        annotations:
          summary: "Worker de procesamiento NLP / Celery caído"
          description: "El contenedor nlp-worker no está respondiendo a las solicitudes de telemetría."

      - alert: NLPLowConfidenceSurge
        expr: (sum(rate(nlp_low_confidence_total[1h])) / sum(rate(nlp_classifications_total[1h]))) * 100 > 30
        for: 30m
        labels:
          severity: warning
          team: ml-engineering
        annotations:
          summary: "Aumento anormal de clasificaciones de baja confianza (> 30%)"
          description: "Más del 30% de los documentos analizados en la última hora han sido catalogados con confianza inferior al 70%, requiriendo revisión humana prioritaria."

      - alert: NLPEmbeddingModelFailure
        expr: increase(nlp_embedding_failures_total[15m]) > 5
        for: 5m
        labels:
          severity: critical
          team: ml-engineering
        annotations:
          summary: "Fallo recurrente en inferencia de embeddings"
          description: "Se han registrado más de 5 excepciones al generar representaciones vectoriales densas."

      - alert: NLPHighErrorRate
        expr: rate(nlp_errors_total[15m]) > 0.05
        for: 10m
        labels:
          severity: critical
          team: ml-engineering
        annotations:
          summary: "Tasa elevada de errores en procesamiento NLP"
          description: "Se detectan fallos recurrentes en las etapas de clasificación, extracción o enriquecimiento semántico."
