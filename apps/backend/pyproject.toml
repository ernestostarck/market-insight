[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-insight-backend"
version = "1.0.0"
description = "Market insight platform for ChileCompra data"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.21",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  # passlib 1.7.4's bcrypt self-test is incompatible with bcrypt>=4.1
  # (raises a spurious "password cannot be longer than 72 bytes" on hash()).
  "bcrypt<4.1",
  "httpx>=0.27",
  "minio>=7.2",
  "redis>=5.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "openpyxl>=3.1",
  "celery>=5.4",
  "sentence-transformers>=3.0",
  "sentry-sdk[fastapi]>=2.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "httpx2>=2.12,<3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "alembic>=1.13",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "slow: loads the real sentence-transformers model (network on first run) — excluded by default",
  "integration: hits a real Postgres instance — excluded by default",
]
addopts = "-m 'not slow and not integration'"

[tool.ruff.lint]
ignore = ["B008"]

