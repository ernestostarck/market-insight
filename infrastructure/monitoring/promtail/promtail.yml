server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - json:
          expressions:
            service: service
            app_name: app_name
            level: level
            pipeline: pipeline
            environment: environment
            request_id: request_id
            event: event
            run_id: run_id
          source: output
      - labels:
          service:
          level:
          pipeline:
          environment:
          event:
      - output:
          source: output
